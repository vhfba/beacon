schema {
  query: Query
  mutation: Mutation
}

type DeletePluginResponse {
  success: Boolean!
  message: String
  pluginId: String
}

type DeleteProbeResponse {
  success: Boolean!
  message: String
  probeId: String
}

type FleetStatusResponse {
  probes: [ProbeType!]!
}

type Mutation {
  recordProbeHeartbeat(input: ProbeHeartbeatInputTypeInput!): ProbeHeartbeatResponse! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  reportProbeMetrics(input: ReportProbeMetricsInputTypeInput!): ReportProbeMetricsResponse! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  updateProbeStatus(probeId: String! status: String!): UpdateProbeStatusResponse! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  updateProbeActionStatus(input: UpdateProbeActionStatusInputTypeInput!): UpdateProbeActionStatusResponse! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  updateProbeControlCommandStatus(input: UpdateProbeControlCommandStatusInputTypeInput!): ProbeControlCommandResponse! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  registerPlugin(input: RegisterPluginInputTypeInput!): RegisterPluginResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  setPluginAvailability(input: SetPluginAvailabilityInputTypeInput!): SetPluginAvailabilityResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  deletePlugin(pluginId: String!): DeletePluginResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  updateProbeTestConfig(input: UpdateProbeTestConfigInputTypeInput!): UpdateProbeTestConfigResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  setProbeTestEnabled(input: SetProbeTestEnabledInputTypeInput!): SetProbeTestEnabledResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  setProbePlugins(input: SetProbePluginsInputTypeInput!): SetProbePluginsResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  deleteProbe(probeId: String!): DeleteProbeResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  triggerProbeAction(input: TriggerProbeActionInputTypeInput!): TriggerProbeActionResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  updateProbeProfile(input: UpdateProbeProfileInputTypeInput!): UpdateProbeProfileResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  requestWifiScan(input: RequestWifiScanInputTypeInput!): ProbeControlCommandResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
  requestWifiConnect(input: RequestWifiConnectInputTypeInput!): ProbeControlCommandResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
}

type PluginType {
  id: String!
  name: String!
  version: String!
  checksum: String!
  description: String
  releasedAt: DateTime!
  available: Boolean!
  executionMode: PluginExecutionModeType!
  bundleUrl: String!
  bundleDownloadUrl: String
  dashboardJson: String
}

type ProbeActionExecutionType {
  executionId: String!
  probeId: String!
  pluginId: String!
  triggeredBy: String!
  status: ProbeActionExecutionStatusType!
  requestedAtUtc: DateTime!
  deliveredAtUtc: DateTime
  startedAtUtc: DateTime
  completedAtUtc: DateTime
  errorMessage: String
}

type ProbeControlCommandResponse {
  success: Boolean!
  message: String
  command: ProbeControlCommandType
}

type ProbeControlCommandType {
  commandId: String!
  probeId: String!
  type: ProbeControlCommandTypeType!
  status: ProbeControlCommandStatusType!
  requestedBy: String!
  requestedAtUtc: DateTime!
  deliveredAtUtc: DateTime
  startedAtUtc: DateTime
  completedAtUtc: DateTime
  payloadJson: String
  resultJson: String
  errorMessage: String
}

type ProbeConfigType {
  probeId: String!
  enabledTests: [ProbeTestConfigType!]!
  availablePlugins: [PluginType!]!
}

type ProbeHeartbeatResponse {
  success: Boolean!
  autoRegistered: Boolean!
  message: String
  probe: ProbeType
  runtime: ProbeRuntimeType
}

type ProbePluginAssignmentType {
  probeId: String!
  pluginId: String!
  pluginName: String!
  pluginVersion: String!
  pluginAvailable: Boolean!
  assignedAt: DateTime!
}

type ProbeRuntimeType {
  probeId: String!
  status: String!
  canEmitMetrics: Boolean!
  enabledTests: [String!]!
  site: String!
  ipAddress: String!
  polledAtUtc: DateTime!
}

type ProbeTestConfigType {
  probeId: String!
  testType: String!
  intervalSeconds: Int!
  enabled: Boolean!
}

type ProbeType {
  id: String!
  name: String!
  location: String!
  ipAddress: String!
  ssid: String
  agentVersion: String
  status: ProbeStatusType!
  createdAt: DateTime!
  lastHeartbeat: DateTime
  lastConfigFetch: DateTime
  lastMetricsPush: DateTime
  lastSeenAt: DateTime
}

type Query {
  probeConfig(probeId: String!): ProbeConfigType! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  probeRuntime(probeId: String!): ProbeRuntimeType! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  probePluginAssignments(probeId: String!): [ProbePluginAssignmentType!]! @authorize(policy: "AdminOnly") @cost(weight: "10")
  probeActionExecutions(probeId: String! limit: Int): [ProbeActionExecutionType!]! @authorize(policy: "AdminOnly") @cost(weight: "10")
  pendingProbeActions(probeId: String! limit: Int): [ProbeActionExecutionType!]! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  probeControlCommands(probeId: String! limit: Int): [ProbeControlCommandType!]! @authorize(policy: "AdminOnly") @cost(weight: "10")
  pendingProbeControlCommands(probeId: String! limit: Int): [ProbeControlCommandType!]! @authorize(policy: "ProbeOrAdmin") @cost(weight: "10")
  plugins: [PluginType!]! @authorize(policy: "AdminOnly") @cost(weight: "10")
  plugin(id: String!): PluginType @authorize(policy: "AdminOnly") @cost(weight: "10")
  fleetStatus: FleetStatusResponse! @authorize(policy: "AdminOnly") @cost(weight: "10")
}

type RegisterPluginResponse {
  success: Boolean!
  message: String
  plugin: PluginType
}

type ReportProbeMetricsResponse {
  success: Boolean!
  message: String
  probeId: String!
  acceptedSamples: Int!
  receivedAtUtc: DateTime!
}

type SetPluginAvailabilityResponse {
  success: Boolean!
  message: String
  plugin: PluginType
}

type SetProbePluginsResponse {
  success: Boolean!
  message: String
  assignments: [ProbePluginAssignmentType!]!
}

type SetProbeTestEnabledResponse {
  success: Boolean!
  message: String
  config: ProbeTestConfigType
}

type TriggerProbeActionResponse {
  success: Boolean!
  message: String
  execution: ProbeActionExecutionType
}

type UpdateProbeActionStatusResponse {
  success: Boolean!
  message: String
  execution: ProbeActionExecutionType
}

type UpdateProbeStatusResponse {
  success: Boolean!
  message: String
  probe: ProbeType
}

type UpdateProbeProfileResponse {
  success: Boolean!
  message: String
  probe: ProbeType
  command: ProbeControlCommandType
}

type UpdateProbeTestConfigResponse {
  success: Boolean!
  message: String
  config: ProbeTestConfigType
}

input MetricLabelInputTypeInput {
  key: String!
  value: String!
}

input MetricSampleInputTypeInput {
  name: String!
  kind: String!
  value: Float!
  timestampUtc: DateTime
  labels: [MetricLabelInputTypeInput!]!
}

input ProbeHeartbeatInputTypeInput {
  probeId: String!
  name: String!
  location: String!
  ipAddress: String!
  ssid: String
  agentVersion: String
}

input RequestWifiConnectInputTypeInput {
  probeId: String!
  ssid: String!
  password: String
  requestedBy: String!
}

input RequestWifiScanInputTypeInput {
  probeId: String!
  requestedBy: String!
}

input RegisterPluginInputTypeInput {
  id: String!
  name: String!
  version: String!
  checksum: String!
  description: String
  bundleDownloadUrl: String
  dashboardJson: String
  executionMode: PluginExecutionModeType!
}

input ReportProbeMetricsInputTypeInput {
  probeId: String!
  samples: [MetricSampleInputTypeInput!]!
}

input SetPluginAvailabilityInputTypeInput {
  pluginId: String!
  available: Boolean!
}

input SetProbePluginsInputTypeInput {
  probeId: String!
  pluginIds: [String!]!
}

input SetProbeTestEnabledInputTypeInput {
  probeId: String!
  testType: String!
  enabled: Boolean!
}

input TriggerProbeActionInputTypeInput {
  probeId: String!
  pluginId: String!
  triggeredBy: String!
}

input UpdateProbeActionStatusInputTypeInput {
  probeId: String!
  executionId: String!
  status: String!
  errorMessage: String
}

input UpdateProbeControlCommandStatusInputTypeInput {
  probeId: String!
  commandId: String!
  status: String!
  resultJson: String
  errorMessage: String
}

input UpdateProbeProfileInputTypeInput {
  probeId: String!
  name: String!
  location: String!
  requestedBy: String!
}

input UpdateProbeTestConfigInputTypeInput {
  probeId: String!
  testType: String!
  intervalSeconds: Int!
  enabled: Boolean!
}

"Defines when a policy shall be executed."
enum ApplyPolicy {
  "Before the resolver was executed."
  BEFORE_RESOLVER
  "After the resolver was executed."
  AFTER_RESOLVER
  "The policy is applied in the validation step before the execution."
  VALIDATION
}

enum PluginExecutionModeType {
  SCHEDULED
  ACTION
}

enum ProbeActionExecutionStatusType {
  QUEUED
  DELIVERED
  RUNNING
  SUCCEEDED
  FAILED
  TIMED_OUT
}

enum ProbeControlCommandStatusType {
  QUEUED
  DELIVERED
  RUNNING
  SUCCEEDED
  FAILED
  TIMED_OUT
}

enum ProbeControlCommandTypeType {
  SCAN_WIFI_NETWORKS
  CONNECT_WIFI
  UPDATE_PROFILE
}

enum ProbeStatusType {
  REGISTERED
  ACTIVE
  INACTIVE
  DECOMMISSIONED
}

"The authorize directive."
directive @authorize("The name of the authorization policy that determines access to the annotated resource." policy: String "Roles that are allowed to access the annotated resource." roles: [String!] "Defines when when the authorize directive shall be applied.By default the authorize directives are applied during the validation phase." apply: ApplyPolicy! = BEFORE_RESOLVER) repeatable on OBJECT | FIELD_DEFINITION

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

"The `@specifiedBy` directive is used within the type system definition language to provide a URL for specifying the behavior of custom scalar definitions."
directive @specifiedBy("The specifiedBy URL points to a human-readable specification. This field will only read a result for scalar types." url: String!) on SCALAR

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime @specifiedBy(url: "https:\/\/www.graphql-scalars.com\/date-time")
