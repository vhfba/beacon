# GraphQL Schema for BEACON Central Server (.NET 9)
# Per ADR-003: GraphQL API for both Admin and Probe clients
# Per ADR-008: HotChocolate GraphQL implementation

## Enums

enum ProbeStatusType {
  REGISTERED
  ACTIVE
  INACTIVE
  DECOMMISSIONED
}

enum PluginExecutionModeType {
  SCHEDULED
  ACTION
}

enum ProbeActionExecutionStatusType {
  QUEUED
  DELIVERED
  RUNNING
  SUCCEEDED
  FAILED
  TIMED_OUT
}

## Scalars

scalar DateTime

## Object Types

"""
Probe type - represents a Raspberry Pi device
"""
type Probe {
  id: String!
  name: String!
  location: String!
  ipAddress: String!
  status: ProbeStatusType!
  createdAt: DateTime!
  lastHeartbeat: DateTime
  lastConfigFetch: DateTime
}

"""
Test type configuration for a probe
"""
type ProbeTestConfig {
  probeId: String!
  testType: String!
  intervalSeconds: Int!
  enabled: Boolean!
}

"""
Probe configuration response - narrow scope for probe agents
"""
type ProbeConfig {
  probeId: String!
  enabledTests: [ProbeTestConfig!]!
  availablePlugins: [Plugin!]!
}

"""
Plugin entity
"""
type Plugin {
  id: String!
  name: String!
  version: String!
  checksum: String!
  description: String
  releasedAt: DateTime!
  available: Boolean!
  executionMode: PluginExecutionModeType!
  bundleUrl: String!
  bundleDownloadUrl: String
  dashboardJson: String
}

"""
Action execution record for a probe
"""
type ProbeActionExecution {
  executionId: String!
  probeId: String!
  pluginId: String!
  triggeredBy: String!
  status: ProbeActionExecutionStatusType!
  requestedAtUtc: DateTime!
  deliveredAtUtc: DateTime
  startedAtUtc: DateTime
  completedAtUtc: DateTime
  errorMessage: String
}

"""
Probe-plugin assignment view
"""
type ProbePluginAssignment {
  probeId: String!
  pluginId: String!
  pluginName: String!
  pluginVersion: String!
  pluginAvailable: Boolean!
  assignedAt: DateTime!
}

"""
Fleet status response
"""
type FleetStatusResponse {
  probes: [Probe!]!
}

## Input Types

"""
Input for updating probe test configuration
"""
input UpdateProbeTestConfigInput {
  probeId: String!
  testType: String!
  intervalSeconds: Int!
  enabled: Boolean! = true
}

"""
Input for registering a plugin
"""
input RegisterPluginInput {
  id: String!
  name: String!
  version: String!
  checksum: String!
  description: String
  bundleDownloadUrl: String
  dashboardJson: String
  executionMode: PluginExecutionModeType! = SCHEDULED
}

"""
Input for triggering a one-off action on a probe
"""
input TriggerProbeActionInput {
  probeId: String!
  pluginId: String!
  triggeredBy: String!
}

"""
Input for enabling or disabling a probe test
"""
input SetProbeTestEnabledInput {
  probeId: String!
  testType: String!
  enabled: Boolean!
}

"""
Input for enabling or disabling a plugin
"""
input SetPluginAvailabilityInput {
  pluginId: String!
  available: Boolean!
}

"""
Input for assigning plugin IDs to a probe
"""
input SetProbePluginsInput {
  probeId: String!
  pluginIds: [String!]!
}

## Response Types

"""
Response from updateProbeTestConfig mutation
"""
type UpdateProbeTestConfigResponse {
  success: Boolean!
  message: String
  config: ProbeTestConfig
}

"""
Response from updateProbeStatus mutation
"""
type UpdateProbeStatusResponse {
  success: Boolean!
  message: String
  probe: Probe
}

"""
Response from registerPlugin mutation
"""
type RegisterPluginResponse {
  success: Boolean!
  message: String
  plugin: Plugin
}

"""
Response from setProbeTestEnabled mutation
"""
type SetProbeTestEnabledResponse {
  success: Boolean!
  message: String
  config: ProbeTestConfig
}

"""
Response from setPluginAvailability mutation
"""
type SetPluginAvailabilityResponse {
  success: Boolean!
  message: String
  plugin: Plugin
}

"""
Response from setProbePlugins mutation
"""
type SetProbePluginsResponse {
  success: Boolean!
  message: String
  assignments: [ProbePluginAssignment!]!
}

"""
Response from deleteProbe mutation
"""
type DeleteProbeResponse {
  success: Boolean!
  message: String
  probeId: String
}

"""
Response from deletePlugin mutation
"""
type DeletePluginResponse {
  success: Boolean!
  message: String
  pluginId: String
}

"""
Response from triggerProbeAction mutation
"""
type TriggerProbeActionResponse {
  success: Boolean!
  message: String
  execution: ProbeActionExecution
}

## Query Root

type Query {
  """
  Get the status of all probes in the fleet (Admin only)
  """
  fleetStatus: FleetStatusResponse!

  """
  Get configuration for a specific probe (called by probes for polling)
  """
  probeConfig(probeId: String!): ProbeConfig!

  """
  List all plugins (available and disabled)
  """
  plugins: [Plugin!]!

  """
  Get a plugin by id
  """
  plugin(id: String!): Plugin

  """
  Get probe plugin assignments for a specific probe
  """
  probePluginAssignments(probeId: String!): [ProbePluginAssignment!]!

  """
  List action execution history for a probe
  """
  probeActionExecutions(probeId: String!, limit: Int! = 50): [ProbeActionExecution!]!
}

## Mutation Root

type Mutation {
  """
  Update test configuration for a probe
  """
  updateProbeTestConfig(input: UpdateProbeTestConfigInput!): UpdateProbeTestConfigResponse!

  """
  Update the status of a probe (e.g., mark as INACTIVE)
  """
  updateProbeStatus(probeId: String!, status: String!): UpdateProbeStatusResponse!

  """
  Register a plugin for probe distribution
  """
  registerPlugin(input: RegisterPluginInput!): RegisterPluginResponse!

  """
  Enable or disable a test for a probe without changing interval
  """
  setProbeTestEnabled(input: SetProbeTestEnabledInput!): SetProbeTestEnabledResponse!

  """
  Enable or disable plugin availability for distribution
  """
  setPluginAvailability(input: SetPluginAvailabilityInput!): SetPluginAvailabilityResponse!

  """
  Add or remove plugins for a specific probe
  """
  setProbePlugins(input: SetProbePluginsInput!): SetProbePluginsResponse!

  """
  Delete a probe and remove all plugin assignments
  """
  deleteProbe(probeId: String!): DeleteProbeResponse!

  """
  Delete a plugin and remove it from every probe assignment
  """
  deletePlugin(pluginId: String!): DeletePluginResponse!

  """
  Trigger a one-off action execution for a probe
  """
  triggerProbeAction(input: TriggerProbeActionInput!): TriggerProbeActionResponse!
}
