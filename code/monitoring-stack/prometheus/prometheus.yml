global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    project: beacon

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/alerts.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          component: monitoring-stack

  - job_name: beacon-central-server
    metrics_path: /metrics
    static_configs:
      - targets:
          - 172.18.0.1:5000
        labels:
          component: central-server
